name: Bug report
description: Something in Flight doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/akhanrepo/flight-dictation/issues) first.
        **Security problems:** don't file them here; see [SECURITY.md](https://github.com/akhanrepo/flight-dictation/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set the push-to-talk key to …
        2. Hold it and say …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Flight version
      description: Shown in the tray menu, or in the installer file name.
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Cleanup engine
      options:
        - Local
        - Cloud
        - AI cleanup off
    validations:
      required: true
  - type: input
    id: languages
    attributes:
      label: Languages (speak → text)
      placeholder: English → English
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines from `%LOCALAPPDATA%\Flight\logs\errors.log`, and `timings.log` for speed problems.
        Check them for anything private before pasting.
      render: text
