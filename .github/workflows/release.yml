name: Release

# Tag vX.Y.Z on main to build the Velopack installer and update package.
# The output is attached to the workflow run as an artifact; nothing is
# published. For local testing, scripts/pack-local.ps1 does the same into
# artifacts\releases (the update feed in appsettings.json).
on:
  push:
    tags: ['v*']

env:
  # Not "Flight": Velopack installs to %LOCALAPPDATA%\<packId> and deletes it
  # on uninstall, and %LOCALAPPDATA%\Flight holds the user's database and models.
  PACK_ID: FlightApp

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test
        run: dotnet test Flight.slnx --configuration Release
      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish src/Flight.App/Flight.App.csproj -c Release -r win-x64 --self-contained
          -p:Platform=x64 -p:Version=${{ env.VERSION }} -o publish
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161
      # Code signing: add --signParams (or --azureTrustedSignFile) here once
      # there's a certificate. Unsigned builds trigger a SmartScreen warning.
      - name: Pack installer
        run: >
          vpk pack --packId ${{ env.PACK_ID }} --packVersion ${{ env.VERSION }}
          --packDir publish --mainExe Flight.App.exe --packTitle Flight --icon assets/brand/flight.ico
      - uses: actions/upload-artifact@v4
        with:
          name: flight-${{ env.VERSION }}
          path: Releases/
