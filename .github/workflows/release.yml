name: Release

# Tag vX.Y.Z on main to test, build the Velopack installer and update
# package, and publish them as a GitHub Release. Installed copies update
# from that release (FlightOptions.UpdateFeed is this repository's URL).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Not "Flight": Velopack installs to %LOCALAPPDATA%\<packId> and deletes it
  # on uninstall, and %LOCALAPPDATA%\Flight holds the user's database and models.
  PACK_ID: FlightApp

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test
        run: dotnet test Flight.slnx --configuration Release
      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish src/Flight.App/Flight.App.csproj -c Release -r win-x64 --self-contained
          -p:Platform=x64 -p:Version=${{ env.VERSION }} -o publish
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161
      # The previous release lets vpk build a small delta update package.
      - name: Download previous release
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Code signing: add --signParams (or --azureTrustedSignFile) here once
      # there's a certificate. Unsigned builds trigger a SmartScreen warning.
      - name: Pack installer
        run: >
          vpk pack --packId ${{ env.PACK_ID }} --packVersion ${{ env.VERSION }}
          --packDir publish --mainExe Flight.App.exe --packTitle Flight --icon assets/brand/flight.ico
      - name: Publish GitHub Release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish
          --releaseName "Flight ${{ env.VERSION }}" --tag v${{ env.VERSION }}
      - uses: actions/upload-artifact@v7
        with:
          name: flight-${{ env.VERSION }}
          path: Releases/
