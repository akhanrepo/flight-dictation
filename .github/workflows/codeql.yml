name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning is free for public repositories only; a private one
    # can't upload the results without GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # No build needed (the WinUI shell can't build on Linux anyway).
          build-mode: none
      - uses: github/codeql-action/analyze@v3
