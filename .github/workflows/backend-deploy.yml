name: Deploy backend

# Pushes the database migrations and Edge Functions in supabase/ to the
# production project. Needs repo secrets SUPABASE_ACCESS_TOKEN (a personal
# access token) and SUPABASE_DB_PASSWORD.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

env:
  SUPABASE_PROJECT_REF: kcemhjdmvunqcnoqwpyr

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Skip when deploy secrets aren't configured
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          version: latest
      - name: Link project
        if: steps.gate.outputs.skip != 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Push migrations
        if: steps.gate.outputs.skip != 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy functions
        if: steps.gate.outputs.skip != 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
