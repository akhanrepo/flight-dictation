# Supabase CLI config for Flight's backend. Link with:
#   npx supabase link --project-ref kcemhjdmvunqcnoqwpyr
project_id = "project-flight"

# Gateway JWT checks are off for every function: the project.s asymmetric
# signing keys and publishable keys aren't legacy JWTs, so each function
# verifies the caller itself (auth.getUser), and the Stripe webhook is
# authenticated by its signature instead.
[functions.entitlement]
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = false

[functions.stripe-portal]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
